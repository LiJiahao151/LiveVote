<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>实时投票</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #6b7280;
      --line: #dfe5ef;
      --brand: #2563eb;
      --brand2: #60a5fa;
      --ok: #16a34a;
      --bad: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top left, #dbeafe 0, transparent 28rem), var(--bg);
      color: var(--text);
    }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 32px 20px; }
    .hidden { display: none !important; }
    .card {
      background: rgba(255,255,255,.92);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 18px 50px rgba(30, 64, 175, .10);
    }
    h1 { margin: 0 0 8px; font-size: clamp(30px, 5vw, 54px); letter-spacing: -0.04em; }
    h2 { margin: 0 0 16px; font-size: 24px; }
    .sub { color: var(--muted); margin: 0; }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 22px; align-items: start; margin-top: 26px; }
    .panel { padding: 24px; }
    .candidate { display: grid; grid-template-columns: 70px minmax(0, 1fr) 72px; gap: 16px; align-items: center; padding: 16px 0; border-bottom: 1px solid #edf1f7; }
    .candidate:last-child { border-bottom: 0; }
    .name { font-weight: 800; font-size: 19px; }
    .track { position: relative; height: 28px; border-radius: 999px; background: #eef2ff; overflow: hidden; }
    .bar { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--brand), var(--brand2)); transition: width .25s ease; }
    .count { text-align: right; font-weight: 800; }
    .total { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 22px; font-weight: 900; }
    .qrbox { text-align: center; }
    #qrcode { display: inline-flex; padding: 14px; background: #fff; border: 1px solid var(--line); border-radius: 18px; margin: 16px 0 12px; }
    .url { overflow-wrap: anywhere; color: var(--muted); font-size: 13px; }
    .status { margin-top: 14px; font-size: 14px; color: var(--muted); }
    .vote-card { max-width: 520px; margin: 36px auto; padding: 28px; }
    .vote-buttons { display: grid; gap: 14px; margin-top: 22px; }
    button {
      border: 0;
      border-radius: 16px;
      padding: 18px 20px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      color: white;
      background: var(--brand);
      box-shadow: 0 12px 25px rgba(37, 99, 235, .24);
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .message { margin-top: 18px; padding: 14px 16px; border-radius: 14px; background: #eff6ff; color: #1d4ed8; }
    .message.ok { background: #ecfdf5; color: var(--ok); }
    .message.bad { background: #fef2f2; color: var(--bad); }
    .tiny { font-size: 13px; color: var(--muted); margin-top: 14px; line-height: 1.6; }
    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
      .wrap { padding: 22px 14px; }
      .candidate { grid-template-columns: 58px minmax(0, 1fr) 64px; gap: 10px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section id="displayView">
      <header>
        <h1>实时投票</h1>
        <p class="sub">手机投票后，电脑页面无需刷新，票数会实时变化。</p>
      </header>
      <div class="grid">
        <div class="card panel">
          <div id="results"></div>
          <div class="total">总票数：<span id="totalVotes">0</span></div>
          <div id="displayStatus" class="status">正在连接 Firestore...</div>
        </div>
        <aside class="card panel qrbox">
          <h2>手机扫码投票</h2>
          <div id="qrcode" aria-label="投票二维码"></div>
          <div id="voteUrlText" class="url"></div>
        </aside>
      </div>
    </section>

    <section id="voteView" class="hidden">
      <div class="card vote-card">
        <h1>请选择一位候选人</h1>
        <p class="sub">每个匿名身份只能投一次，提交后不能修改。</p>
        <div id="voteButtons" class="vote-buttons"></div>
        <div id="voteMessage" class="message hidden"></div>
        <p class="tiny">测试阶段：清除浏览器数据、换浏览器或换设备可能产生新的匿名身份。</p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore,
      collection,
      doc,
      getDoc,
      onSnapshot,
      serverTimestamp,
      setDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "__FIREBASE_API_KEY__",
      authDomain: "__FIREBASE_AUTH_DOMAIN__",
      projectId: "__FIREBASE_PROJECT_ID__",
      storageBucket: "__FIREBASE_STORAGE_BUCKET__",
      messagingSenderId: "__FIREBASE_MESSAGING_SENDER_ID__",
      appId: "__FIREBASE_APP_ID__"
    };

    const POLL_ID = "class-demo";
    const candidates = [
      { id: "zhangsan", name: "张三" },
      { id: "lisi", name: "李四" },
      { id: "wangwu", name: "王五" }
    ];

    const params = new URLSearchParams(location.search);
    const isVoteMode = params.get("vote") === "1";
    const displayView = document.getElementById("displayView");
    const voteView = document.getElementById("voteView");
    const results = document.getElementById("results");
    const totalVotes = document.getElementById("totalVotes");
    const displayStatus = document.getElementById("displayStatus");
    const voteButtons = document.getElementById("voteButtons");
    const voteMessage = document.getElementById("voteMessage");

    if (isVoteMode) {
      displayView.classList.add("hidden");
      voteView.classList.remove("hidden");
    }

    if (firebaseConfig.apiKey.startsWith("__FIREBASE")) {
      const msg = "Firebase 配置尚未注入。请先完成 Firebase Web App 配置和 GitHub Secrets。";
      displayStatus.textContent = msg;
      showVoteMessage(msg, "bad");
      throw new Error(msg);
    }

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const votesRef = collection(db, "polls", POLL_ID, "votes");

    function voteUrl() {
      const url = new URL(location.href);
      url.search = "?vote=1";
      url.hash = "";
      return url.toString();
    }

    function renderQRCode() {
      const target = voteUrl();
      document.getElementById("voteUrlText").textContent = target;
      const qr = qrcode(0, "M");
      qr.addData(target);
      qr.make();
      document.getElementById("qrcode").innerHTML = qr.createSvgTag(5, 0);
    }

    function renderEmptyResults() {
      results.innerHTML = candidates.map(c => `
        <div class="candidate">
          <div class="name">${c.name}</div>
          <div class="track"><div id="bar-${c.id}" class="bar"></div></div>
          <div id="count-${c.id}" class="count">0票</div>
        </div>
      `).join("");
    }

    function updateResults(counts) {
      const total = Object.values(counts).reduce((sum, n) => sum + n, 0);
      totalVotes.textContent = String(total);
      for (const c of candidates) {
        const n = counts[c.id] || 0;
        const width = total > 0 ? Math.round((n / total) * 100) : 0;
        document.getElementById(`count-${c.id}`).textContent = `${n}票`;
        document.getElementById(`bar-${c.id}`).style.width = `${width}%`;
      }
    }

    function listenResults() {
      renderEmptyResults();
      renderQRCode();
      onSnapshot(votesRef, snap => {
        const counts = Object.fromEntries(candidates.map(c => [c.id, 0]));
        snap.forEach(d => {
          const candidate = d.data().candidate;
          if (candidate in counts) counts[candidate] += 1;
        });
        updateResults(counts);
        displayStatus.textContent = `实时监听中：${new Date().toLocaleTimeString()}`;
      }, err => {
        console.error(err);
        displayStatus.textContent = `监听失败：${err.message}`;
      });
    }

    function showVoteMessage(text, type = "") {
      voteMessage.textContent = text;
      voteMessage.className = `message ${type}`.trim();
      voteMessage.classList.remove("hidden");
    }

    function setVoteButtonsDisabled(disabled) {
      voteButtons.querySelectorAll("button").forEach(btn => btn.disabled = disabled);
    }

    function renderVoteButtons(user) {
      voteButtons.innerHTML = candidates.map(c => `<button type="button" data-candidate="${c.id}">${c.name}</button>`).join("");
      voteButtons.addEventListener("click", async event => {
        const btn = event.target.closest("button[data-candidate]");
        if (!btn) return;
        const candidate = btn.dataset.candidate;
        setVoteButtonsDisabled(true);
        showVoteMessage("正在提交...", "");
        try {
          const voteDoc = doc(db, "polls", POLL_ID, "votes", user.uid);
          await setDoc(voteDoc, { candidate, createdAt: serverTimestamp() });
          showVoteMessage("投票成功", "ok");
        } catch (err) {
          console.error(err);
          showVoteMessage("提交失败：你可能已经投过票，不能修改原投票。", "bad");
          setVoteButtonsDisabled(false);
        }
      }, { once: true });
    }

    async function ensureAnonymousAuth() {
      return await new Promise(resolve => {
        const off = onAuthStateChanged(auth, async user => {
          off();
          if (user) return resolve(user);
          const cred = await signInAnonymously(auth);
          resolve(cred.user);
        });
      });
    }

    if (isVoteMode) {
      showVoteMessage("正在获取匿名身份...", "");
      const user = await ensureAnonymousAuth();
      const existing = await getDoc(doc(db, "polls", POLL_ID, "votes", user.uid));
      if (existing.exists()) {
        showVoteMessage("你已经投过票，不能重复投票。", "ok");
      } else {
        voteMessage.classList.add("hidden");
        renderVoteButtons(user);
      }
    } else {
      listenResults();
    }
  </script>
</body>
</html>
