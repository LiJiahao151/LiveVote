<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>2026级班委选举</title>
  <style>
    :root{color-scheme:light;--bg:#f3f6fb;--card:#fff;--text:#14203a;--muted:#687386;--line:#dfe5ef;--brand:#1f5fcc;--ok:#138a4b;--bad:#c9364d}
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 12% 0,#dce9ff 0,transparent 30rem),var(--bg);color:var(--text)}
    .wrap{max-width:1180px;margin:auto;padding:30px 18px 60px}.hidden{display:none!important}h1{font-size:clamp(30px,5vw,52px);margin:0 0 8px;letter-spacing:-.03em}h2{margin:0}.sub,.status,.tiny{color:var(--muted)}
    .role-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:26px}.card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:22px;box-shadow:0 16px 42px rgba(31,95,204,.09)}
    .role-card{padding:22px}.role-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;border-bottom:1px solid var(--line);padding-bottom:16px}.role-title{font-size:25px}.role-sub{font-size:14px;color:var(--muted);margin-top:5px}.mini-qr{width:112px;text-align:center}.mini-qr svg{width:108px;height:108px;display:block}.mini-qr a{font-size:12px;color:var(--brand);text-decoration:none}
    .candidate{display:grid;grid-template-columns:76px 1fr 58px;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #edf1f7}.candidate:last-child{border:0}.name{font-weight:800}.track{height:22px;background:#edf2fb;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#1f5fcc,#55a0ff);border-radius:inherit;transition:width .25s}.count{text-align:right;font-weight:800}.role-total{border-top:1px solid var(--line);padding-top:13px;margin-top:6px;font-weight:800}.status{font-size:13px;margin-top:10px}
    .vote-card{max-width:560px;margin:30px auto;padding:28px}.vote-role{display:inline-block;color:var(--brand);font-weight:900;margin-bottom:10px}.vote-buttons{display:grid;gap:13px;margin-top:24px}button{border:0;border-radius:15px;padding:17px 18px;background:var(--brand);color:#fff;font:inherit;font-weight:900;cursor:pointer;box-shadow:0 10px 24px rgba(31,95,204,.22)}button:disabled{opacity:.55;cursor:not-allowed}.message{margin-top:18px;padding:14px 16px;border-radius:13px;background:#edf4ff;color:#215ab4}.message.ok{background:#eaf8f0;color:var(--ok)}.message.bad{background:#fff0f2;color:var(--bad)}.tiny{font-size:13px;line-height:1.6;margin-top:16px}
    @media(max-width:820px){.role-grid{grid-template-columns:1fr}.wrap{padding:20px 12px}.role-head{align-items:center}.mini-qr{width:96px}.mini-qr svg{width:92px;height:92px}.candidate{grid-template-columns:66px 1fr 52px}}
  </style>
</head>
<body>
<main class="wrap">
  <section id="displayView">
    <h1>2026级班委选举</h1>
    <p class="sub">四个岗位分别投票。扫码提交后，电脑端票数将实时更新。</p>
    <div id="roleGrid" class="role-grid"></div>
  </section>
  <section id="voteView" class="hidden">
    <div class="card vote-card">
      <span id="voteRole" class="vote-role"></span>
      <h1>请选择一位候选人</h1>
      <p class="sub">本岗位每个匿名身份只能投一次，提交后不能修改。</p>
      <div id="voteButtons" class="vote-buttons"></div>
      <div id="voteMessage" class="message hidden"></div>
      <p class="tiny">匿名身份保存在当前浏览器中。清除浏览器数据或更换设备可能产生新的匿名身份。</p>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script type="module">
  import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {getFirestore,collection,doc,getDoc,onSnapshot,serverTimestamp,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  const firebaseConfig={apiKey:"__FIREBASE_API_KEY__",authDomain:"__FIREBASE_AUTH_DOMAIN__",projectId:"__FIREBASE_PROJECT_ID__",storageBucket:"__FIREBASE_STORAGE_BUCKET__",messagingSenderId:"__FIREBASE_MESSAGING_SENDER_ID__",appId:"__FIREBASE_APP_ID__"};
  const POLL_ID="class-election-2026";
  const roles={
    org:{name:"组织委员",subtitle:"兼宣传委员",candidates:[{id:"huangchuanhao",name:"黄传浩"},{id:"sunsiqi",name:"孙思齐"},{id:"fengwenjiao",name:"冯文娇"},{id:"miaoyoujia",name:"缪游佳"},{id:"chensitong",name:"陈思彤"}]},
    life:{name:"生活委员",subtitle:"兼安全委员",candidates:[{id:"wangxinjun",name:"王新军"},{id:"linpeng",name:"林鹏"}]},
    tech:{name:"科技委员",subtitle:"兼文体委员",candidates:[{id:"yiru",name:"易茹"},{id:"zhouhanfei",name:"周寒菲"},{id:"tianhuijun",name:"田慧君"},{id:"houlong",name:"侯龙"}]},
    discipline:{name:"纪检委员",subtitle:"兼权益委员",candidates:[{id:"zoujingdan",name:"邹敬丹"},{id:"wangwenjun",name:"王文俊"}]}
  };
  const params=new URLSearchParams(location.search),roleId=params.get("vote"),isVote=Boolean(roles[roleId]);
  const displayView=document.querySelector("#displayView"),voteView=document.querySelector("#voteView"),roleGrid=document.querySelector("#roleGrid"),voteButtons=document.querySelector("#voteButtons"),voteMessage=document.querySelector("#voteMessage");
  if(isVote){displayView.classList.add("hidden");voteView.classList.remove("hidden")}
  if(firebaseConfig.apiKey.startsWith("__FIREBASE"))throw new Error("Firebase 配置尚未注入");
  const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
  const voteUrl=id=>{const u=new URL(location.href);u.search=`?vote=${id}`;u.hash="";return u.toString()};
  function qrSvg(url,size=4){const qr=qrcode(0,"M");qr.addData(url);qr.make();return qr.createSvgTag(size,0)}
  function displayCard(id,role){return `<article class="card role-card"><div class="role-head"><div><h2 class="role-title">${role.name}</h2><div class="role-sub">${role.subtitle}</div></div><div class="mini-qr">${qrSvg(voteUrl(id),3)}<a href="${voteUrl(id)}">打开投票页</a></div></div><div id="results-${id}">${role.candidates.map(c=>`<div class="candidate"><div class="name">${c.name}</div><div class="track"><div id="bar-${id}-${c.id}" class="bar"></div></div><div id="count-${id}-${c.id}" class="count">0票</div></div>`).join("")}</div><div class="role-total">本岗位总票数：<span id="total-${id}">0</span></div><div id="status-${id}" class="status">正在连接...</div></article>`}
  function listenRole(id,role){const ref=collection(db,"polls",POLL_ID,"roles",id,"votes");onSnapshot(ref,snap=>{const counts=Object.fromEntries(role.candidates.map(c=>[c.id,0]));snap.forEach(d=>{const c=d.data().candidate;if(c in counts)counts[c]++});const total=Object.values(counts).reduce((a,b)=>a+b,0);document.querySelector(`#total-${id}`).textContent=total;role.candidates.forEach(c=>{const n=counts[c.id],pct=total?Math.round(n/total*100):0;document.querySelector(`#count-${id}-${c.id}`).textContent=`${n}票`;document.querySelector(`#bar-${id}-${c.id}`).style.width=`${pct}%`});document.querySelector(`#status-${id}`).textContent=`实时监听中：${new Date().toLocaleTimeString()}`},err=>{document.querySelector(`#status-${id}`).textContent=`监听失败：${err.message}`})}
  function showMessage(text,type=""){voteMessage.textContent=text;voteMessage.className=`message ${type}`.trim();voteMessage.classList.remove("hidden")}
  function timeout(p,ms,msg){let t;return Promise.race([p,new Promise((_,r)=>t=setTimeout(()=>r(new Error(msg)),ms))]).finally(()=>clearTimeout(t))}
  async function getUser(){if(auth.currentUser)return auth.currentUser;return (await timeout(signInAnonymously(auth),12000,"匿名登录超时，请切换网络后重试。" )).user}
  function retry(){voteButtons.innerHTML='<button id="retry">重新连接</button>';document.querySelector("#retry").onclick=startVote}
  async function startVote(){const role=roles[roleId];document.querySelector("#voteRole").textContent=`${role.name} · ${role.subtitle}`;voteButtons.innerHTML="";showMessage("正在获取匿名身份...");const slow=setTimeout(()=>showMessage("仍在连接 Firebase。如果手机访问较慢，请稍等或切换网络。"),4000);try{const user=await getUser();clearTimeout(slow);const ref=doc(db,"polls",POLL_ID,"roles",roleId,"votes",user.uid);const existing=await timeout(getDoc(ref),12000,"读取投票状态超时，请重试。");if(existing.exists()){showMessage("你已经完成本岗位投票，不能重复提交。","ok");return}voteMessage.classList.add("hidden");voteButtons.innerHTML=role.candidates.map(c=>`<button data-id="${c.id}">${c.name}</button>`).join("");voteButtons.onclick=async e=>{const btn=e.target.closest("button[data-id]");if(!btn)return;voteButtons.querySelectorAll("button").forEach(b=>b.disabled=true);showMessage("正在提交...");try{await setDoc(ref,{candidate:btn.dataset.id,createdAt:serverTimestamp()});showMessage("本岗位投票成功。","ok")}catch(err){console.error(err);showMessage("提交失败：你可能已经投过本岗位，或安全规则尚未更新。","bad");voteButtons.querySelectorAll("button").forEach(b=>b.disabled=false)}}}catch(err){clearTimeout(slow);console.error(err);showMessage(err.message||"连接失败，请重试。","bad");retry()}}
  if(isVote)startVote();else{roleGrid.innerHTML=Object.entries(roles).map(([id,r])=>displayCard(id,r)).join("");Object.entries(roles).forEach(([id,r])=>listenRole(id,r))}
</script>
</body>
</html>
